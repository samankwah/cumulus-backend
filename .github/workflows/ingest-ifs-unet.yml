name: Ingest 46-day runs

# For every model in the viewer's model picker, pulls the newest complete run from Azure Blob
# Storage and converts it into the compact Ghana artifact under data/artifacts/subseasonal/<model>/.
# Each run's per-area summary for the open /v1 API is archived alongside, under
# data/archive/subseasonal/<model>/ (never pruned). The artifacts are not committed: they are
# published to the Vercel Blob store (BLOB_READ_WRITE_TOKEN secret, see
# src/cumulus/subseasonal/store.py), and the API picks new runs up within a minute, with no
# redeploy. A run already ingested from the same files changes nothing. Once the API serves the
# new runs, partners with a webhook in the PARTNERS_JSON secret (the deployment's CUMULUS_PARTNERS
# value) are sent a signed "run.published" event for each (see src/cumulus/announce.py).
#
# The models, their folders and their secrets all come from `subseasonal.models` in
# configs/base.yaml: each model names the repository secret holding its container SAS URL
# (`sas_secret`, Read + List permission:
# https://<account>.blob.core.windows.net/<container>?sv=...&sig=...) and where its runs sit
# (`live`: upstream's live layout, newest date folder first). Today every model reads
#   ITALYNORTH_SAS_URL  -> https://italynorthdata.blob.core.windows.net/data?<token>
# (IFS, Aurora-ERA5 and Aurora-IMERG x UNet, Diffusion, Flow matching, Bilinear). Ensembles are
# ~530 MB of raw files a run, so each model's raw download is deleted once ingested.
# A model whose secret is not set is skipped with a warning. Once any model fails, an issue
# labelled "ingest-failure" is opened (or commented on).
#
# The first real run of a model also deletes any synthetic demo run kept for it.

on:
  schedule:
    # Upstream upload time varies; check three times a day. Unchanged runs are no-ops.
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to ingest (see subseasonal.models in configs/base.yaml, e.g. aurora_imerg_unet). Leave empty for all."
        required: false
      init_date:
        description: "Run to ingest (YYYY-MM-DD). Leave empty for the newest complete run."
        required: false
      force:
        description: "Rebuild the artifact even if the run was already ingested."
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest-ifs-unet
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[ingest]"

      # The store's public URL comes from its token: vercel_blob_rw_<store id>_<secret>.
      - name: Pull the current runs from the Blob store
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::Repository secret BLOB_READ_WRITE_TOKEN is not set; runs would have nowhere to go."
            exit 1
          fi
          store_id=$(echo "$BLOB_READ_WRITE_TOKEN" | cut -d_ -f4)
          echo "CUMULUS_STORE__URL=https://${store_id}.public.blob.vercel-storage.com" >> "$GITHUB_ENV"
          CUMULUS_STORE__URL="https://${store_id}.public.blob.vercel-storage.com" python -m cumulus.subseasonal.store pull

      - name: Ingest
        id: ingest
        env:
          # Secrets are passed by name: GitHub holds runs that read every secret (toJSON(secrets))
          # as "action required", which silently stopped this job from 22 Oct to 18 Nov 2026.
          # A model naming another secret in configs/base.yaml needs it added here too.
          ITALYNORTH_SAS_URL: ${{ secrets.ITALYNORTH_SAS_URL }}
          ONLY_MODEL: ${{ github.event.inputs.model }}
          INIT_DATE: ${{ github.event.inputs.init_date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          # "<model id> <secret name>" for every model in the registry, in registry order.
          mapfile -t models < <(python - <<'PY'
          from cumulus.settings import get_settings
          for model_id, spec in get_settings().subseasonal.models.items():
              print(model_id, spec.sas_secret or "")
          PY
          )
          failed=()
          ingested=()
          # Models run one after another; one publish afterwards uploads every new run.
          for entry in "${models[@]}"; do
            read -r model secret_name <<<"$entry"
            if [ -n "$ONLY_MODEL" ] && [ "$ONLY_MODEL" != "$model" ]; then
              continue
            fi
            sas_url=""
            if [ -n "$secret_name" ]; then
              sas_url="${!secret_name:-}"
            fi
            if [ -z "$sas_url" ]; then
              # Not configured yet: skip quietly instead of failing (and opening an issue) on every run.
              echo "::warning::Repository secret ${secret_name:-<none in configs/base.yaml>} is not set; skipping $model."
              continue
            fi
            args=(--model "$model" --source azure --clean-raw)
            if [ -n "$INIT_DATE" ]; then
              args+=(--init-date "$INIT_DATE")
            else
              args+=(--latest --require-complete)
            fi
            if [ "$FORCE" = "true" ]; then
              args+=(--force)
            fi
            echo "::group::$model"
            if CUMULUS_SUBSEASONAL__AZURE_SAS_URL="$sas_url" python -m cumulus.subseasonal.ingest "${args[@]}"; then
              ingested+=("$model")
            else
              echo "::error::Ingest failed for $model."
              failed+=("$model")
            fi
            echo "::endgroup::"
          done
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          echo "ingested=${ingested[*]}" >> "$GITHUB_OUTPUT"

      - name: Test
        env:
          # The tests use their own sample runs, not the store pulled above.
          CUMULUS_STORE__URL: ""
        run: |
          pip install -e ".[dev]"
          python -m pytest -q tests/test_subseasonal.py tests/test_store.py

      # Uploads only what changed (new runs, pointers, summaries) and drops pruned runs; the API
      # mirrors the store, so nothing is committed and nothing is redeployed.
      - name: Publish to the Blob store
        id: publish
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python -m cumulus.subseasonal.store publish --only subseasonal --only archive/subseasonal --github-output "$GITHUB_OUTPUT"

      - name: Announce new runs
        if: steps.publish.outputs.promoted != ''
        env:
          PARTNERS_JSON: ${{ secrets.PARTNERS_JSON }}
          PROMOTED: ${{ steps.publish.outputs.promoted }}
        run: |
          # Without the secret there are no webhooks, but the step still checks the runs went live.
          export CUMULUS_PARTNERS="${PARTNERS_JSON:-"{}"}"
          args=()
          for model in $PROMOTED; do args+=(--model "$model"); done
          python -m cumulus.announce "${args[@]}"

      # Models that failed are reported after any good runs were published.
      - name: Fail if a model failed
        if: steps.ingest.outputs.failed != ''
        run: |
          echo "::error::Ingest failed for: ${{ steps.ingest.outputs.failed }}"
          exit 1

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.ingest.outputs.failed }}
        run: |
          body="46-day ingest failed${FAILED:+ for: $FAILED}: $RUN_URL. If the log shows HTTP 401/403, that model's SAS URL secret has likely expired."
          number=$(gh issue list --label ingest-failure --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create ingest-failure --color B60205 --description "Scheduled 46-day ingest failed" 2>/dev/null || true
            gh issue create --title "46-day ingest is failing" --label ingest-failure --body "$body"
          fi
