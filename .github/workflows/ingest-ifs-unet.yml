name: Ingest IFS-UNet run

# Pulls the newest IFS-UNet sub-seasonal run from Azure Blob Storage, converts it into the
# compact Ghana artifact under data/artifacts/subseasonal/ and commits it, which redeploys the API.
#
# Requires the repository secret IFS_UNET_SAS_URL: a container SAS URL with Read + List
# permission, e.g. https://<account>.blob.core.windows.net/<container>?sv=...&sig=...

on:
  schedule:
    - cron: "30 6 * * *" # daily, 06:30 UTC
  workflow_dispatch:
    inputs:
      init_date:
        description: "Run to ingest (YYYY-MM-DD). Leave empty for the latest."
        required: false

permissions:
  contents: write

concurrency:
  group: ingest-ifs-unet
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[ingest]"

      - name: Ingest
        env:
          CUMULUS_SUBSEASONAL__AZURE_SAS_URL: ${{ secrets.IFS_UNET_SAS_URL }}
          INIT_DATE: ${{ github.event.inputs.init_date }}
        run: |
          if [ -z "$CUMULUS_SUBSEASONAL__AZURE_SAS_URL" ]; then
            echo "::error::Repository secret IFS_UNET_SAS_URL is not set."
            exit 1
          fi
          if [ -n "$INIT_DATE" ]; then
            python -m cumulus.subseasonal.ingest --source azure --init-date "$INIT_DATE"
          else
            python -m cumulus.subseasonal.ingest --source azure --latest
          fi

      - name: Test
        run: |
          pip install -e ".[dev]"
          python -m pytest -q tests/test_subseasonal.py

      - name: Commit artifact
        run: |
          if [ -z "$(git status --porcelain data/artifacts/subseasonal)" ]; then
            echo "No new run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/artifacts/subseasonal
          git commit -m "Ingest IFS-UNet run $(python -c 'import json;print(json.load(open("data/artifacts/subseasonal/ifs_unet/active.json"))["run_id"])')"
          git push
