name: Ingest 46-day runs

# For every model in the viewer's model picker, pulls the newest complete run from Azure Blob
# Storage, converts it into the compact Ghana artifact under data/artifacts/subseasonal/<model>/
# and commits the lot in one commit, which redeploys the API. Each run's per-area summary for the
# open /v1 API is archived alongside, under data/archive/subseasonal/<model>/ (never pruned). A run
# already ingested from the same files changes nothing, so the job only commits (and redeploys)
# when something is new.
#
# The models, their folders and their secrets all come from `subseasonal.models` in
# configs/base.yaml: each model names the repository secret holding its container SAS URL
# (`sas_secret`, Read + List permission:
# https://<account>.blob.core.windows.net/<container>?sv=...&sig=...) and its folder inside
# the container (`azure_prefix`). Today:
#   IFS_UNET_SAS_URL       -> ifs_unet (Unet/), ifs_bilinear
#   IFS_DIFFUSION_SAS_URL  -> ifs_diffusion (may be the same URL as IFS-UNet's)
#   AURORA_SAS_URL         -> aurora_imerg_* and aurora_era5_* (unet, diffusion, bilinear)
# A model whose secret is not set is skipped with a warning. Once any model fails, an issue
# labelled "ingest-failure" is opened (or commented on).
#
# The first real run of a model also deletes any synthetic demo run kept for it.

on:
  schedule:
    # Upstream upload time varies; check three times a day. Unchanged runs are no-ops.
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to ingest (see subseasonal.models in configs/base.yaml, e.g. aurora_imerg_unet). Leave empty for all."
        required: false
      init_date:
        description: "Run to ingest (YYYY-MM-DD). Leave empty for the newest complete run."
        required: false
      force:
        description: "Rebuild the artifact even if the run was already ingested."
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest-ifs-unet
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[ingest]"

      - name: Ingest
        id: ingest
        env:
          # All repository secrets as JSON (values stay masked in the log); each model picks its own.
          SECRETS_JSON: ${{ toJSON(secrets) }}
          ONLY_MODEL: ${{ github.event.inputs.model }}
          INIT_DATE: ${{ github.event.inputs.init_date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          # "<model id> <secret name>" for every model in the registry, in registry order.
          mapfile -t models < <(python - <<'PY'
          from cumulus.settings import get_settings
          for model_id, spec in get_settings().subseasonal.models.items():
              print(model_id, spec.sas_secret or "")
          PY
          )
          failed=()
          ingested=()
          # Models run one after another, so a single commit carries every new run.
          for entry in "${models[@]}"; do
            read -r model secret_name <<<"$entry"
            if [ -n "$ONLY_MODEL" ] && [ "$ONLY_MODEL" != "$model" ]; then
              continue
            fi
            sas_url=""
            if [ -n "$secret_name" ]; then
              sas_url=$(python -c 'import json, os, sys; print(json.loads(os.environ["SECRETS_JSON"]).get(sys.argv[1], ""))' "$secret_name")
            fi
            if [ -z "$sas_url" ]; then
              # Not configured yet: skip quietly instead of failing (and opening an issue) on every run.
              echo "::warning::Repository secret ${secret_name:-<none in configs/base.yaml>} is not set; skipping $model."
              continue
            fi
            args=(--model "$model" --source azure)
            if [ -n "$INIT_DATE" ]; then
              args+=(--init-date "$INIT_DATE")
            else
              args+=(--latest --require-complete)
            fi
            if [ "$FORCE" = "true" ]; then
              args+=(--force)
            fi
            echo "::group::$model"
            if CUMULUS_SUBSEASONAL__AZURE_SAS_URL="$sas_url" python -m cumulus.subseasonal.ingest "${args[@]}"; then
              ingested+=("$model")
            else
              echo "::error::Ingest failed for $model."
              failed+=("$model")
            fi
            echo "::endgroup::"
          done
          if [ -n "$(git status --porcelain data/artifacts/subseasonal data/archive/subseasonal)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new run."
          fi
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          echo "ingested=${ingested[*]}" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.ingest.outputs.changed == 'true'
        run: |
          pip install -e ".[dev]"
          python -m pytest -q tests/test_subseasonal.py

      - name: Commit artifacts
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/artifacts/subseasonal data/archive/subseasonal
          runs=$(python - <<'PY'
          import json, pathlib
          root = pathlib.Path("data/artifacts/subseasonal")
          active = []
          for pointer in sorted(root.glob("*/active.json")):
              active.append(json.loads(pointer.read_text())["run_id"])
          print(", ".join(active))
          PY
          )
          git commit -m "Ingest 46-day runs: ${runs}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Models that failed are reported after any good runs were committed.
      - name: Fail if a model failed
        if: steps.ingest.outputs.failed != ''
        run: |
          echo "::error::Ingest failed for: ${{ steps.ingest.outputs.failed }}"
          exit 1

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.ingest.outputs.failed }}
        run: |
          body="46-day ingest failed${FAILED:+ for: $FAILED}: $RUN_URL. If the log shows HTTP 401/403, that model's SAS URL secret has likely expired."
          number=$(gh issue list --label ingest-failure --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create ingest-failure --color B60205 --description "Scheduled 46-day ingest failed" 2>/dev/null || true
            gh issue create --title "46-day ingest is failing" --label ingest-failure --body "$body"
          fi
