name: Ingest observed rain (IMERG)

# Folds new IMERG late-run daily totals into data/artifacts/observed/imerg/ and publishes them to
# the Vercel Blob store (BLOB_READ_WRITE_TOKEN secret, see src/cumulus/subseasonal/store.py); the
# API picks them up within a minute: a forecast's elapsed days then show what was observed rather
# than what had been forecast. Nothing new changes nothing. Nothing is committed.
#
# Upstream downloads the half-hourly late-run files as they appear and preprocesses them into
# daily 00-24 UTC totals at 0.25 degrees in Azure Blob Storage (account italynorthdata, container
# data, folder imerg-lr/processed/0p25/data). The repository secret IMERG_SAS_URL is a container
# SAS URL with Read + List permission (https://italynorthdata.blob.core.windows.net/data?sv=...);
# until it is set the job is skipped with a warning.

on:
  schedule:
    # The late run lags real time by about 14 hours; a day is complete by mid-afternoon UTC.
    - cron: "15 16 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the artifact from every file rather than adding new days."
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  # Shares the forecast ingest's group, so the two never publish at the same time.
  group: ingest-ifs-unet
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[ingest]"

      # Only the observed tree is pulled and published; the forecast runs are left alone.
      - name: Pull observed rain from the Blob store
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::Repository secret BLOB_READ_WRITE_TOKEN is not set; observed rain would have nowhere to go."
            exit 1
          fi
          store_id=$(echo "$BLOB_READ_WRITE_TOKEN" | cut -d_ -f4)
          echo "CUMULUS_STORE__URL=https://${store_id}.public.blob.vercel-storage.com" >> "$GITHUB_ENV"
          CUMULUS_STORE__URL="https://${store_id}.public.blob.vercel-storage.com" python -m cumulus.subseasonal.store pull

      - name: Ingest
        id: ingest
        env:
          # Same container as the forecasts, so the forecasts' SAS works too.
          IMERG_SAS_URL: ${{ secrets.IMERG_SAS_URL || secrets.ITALYNORTH_SAS_URL }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -z "$IMERG_SAS_URL" ]; then
            echo "::warning::Repository secret IMERG_SAS_URL is not set; skipping observed rain."
            exit 0
          fi
          args=(--source azure)
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          python -m cumulus.subseasonal.observed "${args[@]}"
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.ingest.outputs.ran == 'true'
        env:
          # The tests use their own sample runs, not the store pulled above.
          CUMULUS_STORE__URL: ""
        run: |
          pip install -e ".[dev]"
          python -m pytest -q tests/test_subseasonal.py tests/test_store.py

      - name: Publish to the Blob store
        if: steps.ingest.outputs.ran == 'true'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python -m cumulus.subseasonal.store publish --only observed/imerg

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Observed-rain (IMERG) ingest failed: $RUN_URL. If the log shows HTTP 401/403, the IMERG_SAS_URL secret has likely expired."
          number=$(gh issue list --label ingest-failure --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create ingest-failure --color B60205 --description "Scheduled ingest failed" 2>/dev/null || true
            gh issue create --title "Observed-rain ingest is failing" --label ingest-failure --body "$body"
          fi
