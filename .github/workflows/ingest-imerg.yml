name: Ingest observed rain (IMERG)

# Folds new IMERG late-run daily totals into data/artifacts/observed/imerg/ and commits them,
# which redeploys the API: a forecast's elapsed days then show what was observed rather than
# what had been forecast. Nothing new changes nothing, so the job only commits when a day is new.
#
# Upstream downloads the half-hourly late-run files as they appear and preprocesses them into
# daily 00-24 UTC totals at 0.25 degrees in Azure Blob Storage (account italynorthdata, container
# data, folder imerg-lr/processed/0p25/data). The repository secret IMERG_SAS_URL is a container
# SAS URL with Read + List permission (https://italynorthdata.blob.core.windows.net/data?sv=...);
# until it is set the job is skipped with a warning.

on:
  schedule:
    # The late run lags real time by about 14 hours; a day is complete by mid-afternoon UTC.
    - cron: "15 16 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the artifact from every file rather than adding new days."
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  # Shares the forecast ingest's group, so the two never push at the same time.
  group: ingest-ifs-unet
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[ingest]"

      - name: Ingest
        id: ingest
        env:
          IMERG_SAS_URL: ${{ secrets.IMERG_SAS_URL }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -z "$IMERG_SAS_URL" ]; then
            echo "::warning::Repository secret IMERG_SAS_URL is not set; skipping observed rain."
            exit 0
          fi
          args=(--source azure)
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          python -m cumulus.subseasonal.observed "${args[@]}"
          if [ -n "$(git status --porcelain data/artifacts/observed)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.ingest.outputs.changed == 'true'
        run: |
          pip install -e ".[dev]"
          python -m pytest -q tests/test_subseasonal.py

      - name: Commit artifact
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/artifacts/observed
          last=$(python -c "import json; print(json.load(open('data/artifacts/observed/imerg/manifest.json'))['last_date'])")
          git commit -m "Observed rain (IMERG) up to ${last}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Observed-rain (IMERG) ingest failed: $RUN_URL. If the log shows HTTP 401/403, the IMERG_SAS_URL secret has likely expired."
          number=$(gh issue list --label ingest-failure --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create ingest-failure --color B60205 --description "Scheduled ingest failed" 2>/dev/null || true
            gh issue create --title "Observed-rain ingest is failing" --label ingest-failure --body "$body"
          fi
