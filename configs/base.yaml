project_name: cumulus
time_zone: UTC
forecast_horizon_days: 14
raw_data_dir: data/raw
default_station_path: Rainfall_data.xlsx
default_forecast_source: gfs
forecast_sources:
  era5:
    variables:
      - tp
      - u10
      - v10
      - t2m
    national_calibration_version: era5_national_backbone_v1
    regional_calibration_versions:
      Coastal Savannah: era5_coastal_savannah_4km_v1
      Forest: era5_forest_4km_v1
      Transition: era5_transition_4km_v1
      Guinea Savannah: era5_guinea_savannah_4km_v1
      Sudan Savannah: era5_sudan_savannah_4km_v1
  gfs:
    variables:
      - tp
      - u10
      - v10
      - t2m
    national_calibration_version: gfs_national_backbone_v1
    regional_calibration_versions:
      Coastal Savannah: gfs_coastal_savannah_4km_v1
      Forest: gfs_forest_4km_v1
      Transition: gfs_transition_4km_v1
      Guinea Savannah: gfs_guinea_savannah_4km_v1
      Sudan Savannah: gfs_sudan_savannah_4km_v1
data_pipeline:
  ghana_bounds:
    latitude_min: 4.5
    latitude_max: 11.5
    longitude_min: -3.5
    longitude_max: 1.5
  daily_frequency: D
  station_target_column: rainfall_mm
  xarray_chunks: {}
  target_resolution_km: 4.0
rainfall_variable_aliases:
  tp: precip_mm
  precip: precip_mm
  precipitation: precip_mm
  prate: precip_mm
  rainfall: precip_mm
  rainfall_mm: precip_mm
  t2m: temp_c
  temperature: temp_c
  u10: u10
  v10: v10
feature_columns:
  - latitude
  - longitude
  - precip_mm
  - temp_c
  - wind_speed
  - month
  - day_of_year
  - week_of_year
  - month_sin
  - month_cos
  - doy_sin
  - doy_cos
  - rain_lag_1
  - rain_lag_3
  - rain_lag_7
  - rain_roll_3
  - rain_roll_7
  - rain_roll_14
bias_correction:
  method: quantile_mapping
  calibration_min_samples: 200
  quantile_count: 99
advisory:
  dry_day_threshold_mm: 1.0
  dry_spell_days: 7
  onset_window_days: 3
  onset_threshold_mm: 20.0
  onset_guard_days: 10
  onset_guard_dry_days: 7
  cessation_window_days: 14
  cessation_threshold_mm: 10.0
  cumulative_windows_days:
    - 7
    - 14
  farmer:
    crop_name: maize
    planting_window_days: 3
    planting_rain_threshold_mm: 20.0
    planting_guard_days: 10
    planting_guard_dry_days: 7
    dry_spell_watch_days: 5
    dry_spell_warning_days: 7
    irrigation_window_days: 5
    irrigation_target_rain_mm: 15.0
    irrigation_severe_deficit_mm: 8.0
    hot_temperature_c: 32.0
    high_stress_temperature_c: 35.0
train:
  test_fraction: 0.15
  validation_fraction: 0.15
forecast_products:
  require_standard_grid_coverage: true
  standard_grid_min_y: 10
  standard_grid_min_x: 10
  standard_grid_coverage_tolerance_degrees: 0.35
  final_product_sources:
    rainfall_amount:
      MAM:
        deterministic_path: E:/Forecast_Det_PRCPMarAprMay_2026.nc
        probability_path: E:/Forecast_Prob_PRCPMarAprMay_2026.nc
        forecast_year: 2026
        title: Seasonal Rainfall Total
      MJJ:
        deterministic_path: E:/obj_files/Forecast_Det_PRCPMayJunJul_2026.nc
        probability_path: E:/obj_files/Forecast_Prob_PRCPMayJunJul_2026.nc
        forecast_year: 2026
        title: Seasonal Rainfall Total
      JAS:
        deterministic_path: E:/obj_files/Forecast_Det_PRCPJulAugSep_2026.nc
        probability_path: E:/obj_files/Forecast_Prob_PRCPJulAugSep_2026.nc
        forecast_year: 2026
        title: Seasonal Rainfall Total
