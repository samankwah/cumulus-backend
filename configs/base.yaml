project_name: cumulus
time_zone: UTC
forecast_horizon_days: 14
raw_data_dir: data/raw
default_station_path: Rainfall_data.xlsx
default_forecast_source: gfs
forecast_sources:
  era5:
    variables:
      - tp
      - u10
      - v10
      - t2m
    national_calibration_version: era5_national_backbone_v1
    regional_calibration_versions:
      Coastal Savannah: era5_coastal_savannah_4km_v1
      Forest: era5_forest_4km_v1
      Transition: era5_transition_4km_v1
      Guinea Savannah: era5_guinea_savannah_4km_v1
      Sudan Savannah: era5_sudan_savannah_4km_v1
  gfs:
    variables:
      - tp
      - u10
      - v10
      - t2m
    national_calibration_version: gfs_national_backbone_v1
    regional_calibration_versions:
      Coastal Savannah: gfs_coastal_savannah_4km_v1
      Forest: gfs_forest_4km_v1
      Transition: gfs_transition_4km_v1
      Guinea Savannah: gfs_guinea_savannah_4km_v1
      Sudan Savannah: gfs_sudan_savannah_4km_v1
data_pipeline:
  ghana_bounds:
    latitude_min: 4.5
    latitude_max: 11.5
    longitude_min: -3.5
    longitude_max: 1.5
  daily_frequency: D
  station_target_column: rainfall_mm
  xarray_chunks: {}
  target_resolution_km: 4.0
rainfall_variable_aliases:
  tp: precip_mm
  precip: precip_mm
  precipitation: precip_mm
  prate: precip_mm
  rainfall: precip_mm
  rainfall_mm: precip_mm
  t2m: temp_c
  temperature: temp_c
  u10: u10
  v10: v10
feature_columns:
  - latitude
  - longitude
  - precip_mm
  - temp_c
  - wind_speed
  - month
  - day_of_year
  - week_of_year
  - month_sin
  - month_cos
  - doy_sin
  - doy_cos
  - rain_lag_1
  - rain_lag_3
  - rain_lag_7
  - rain_roll_3
  - rain_roll_7
  - rain_roll_14
bias_correction:
  method: quantile_mapping
  calibration_min_samples: 200
  quantile_count: 99
advisory:
  dry_day_threshold_mm: 1.0
  dry_spell_days: 7
  onset_window_days: 3
  onset_threshold_mm: 20.0
  onset_guard_days: 10
  onset_guard_dry_days: 7
  cessation_window_days: 14
  cessation_threshold_mm: 10.0
  cumulative_windows_days:
    - 7
    - 14
  farmer:
    crop_name: maize
    planting_window_days: 3
    planting_rain_threshold_mm: 20.0
    planting_guard_days: 10
    planting_guard_dry_days: 7
    dry_spell_watch_days: 5
    dry_spell_warning_days: 7
    irrigation_window_days: 5
    irrigation_target_rain_mm: 15.0
    irrigation_severe_deficit_mm: 8.0
    hot_temperature_c: 32.0
    high_stress_temperature_c: 35.0
train:
  test_fraction: 0.15
  validation_fraction: 0.15
forecast_products:
  require_standard_grid_coverage: true
  standard_grid_min_y: 10
  standard_grid_min_x: 10
  standard_grid_coverage_tolerance_degrees: 0.35
  final_product_sources:
    rainfall_amount:
      MAM:
        deterministic_path: E:/Forecast_Det_PRCPMarAprMay_2026.nc
        probability_path: E:/Forecast_Prob_PRCPMarAprMay_2026.nc
        forecast_year: 2026
        title: Seasonal Rainfall Total
      MJJ:
        deterministic_path: E:/obj_files/Forecast_Det_PRCPMayJunJul_2026.nc
        probability_path: E:/obj_files/Forecast_Prob_PRCPMayJunJul_2026.nc
        forecast_year: 2026
        title: Seasonal Rainfall Total
      JAS:
        deterministic_path: E:/obj_files/Forecast_Det_PRCPJulAugSep_2026.nc
        probability_path: E:/obj_files/Forecast_Prob_PRCPJulAugSep_2026.nc
        forecast_year: 2026
        title: Seasonal Rainfall Total
subseasonal:
  # Sub-seasonal (S2S) runs downscaled to 0.1 degrees over Africa (46 daily leads; one run or an
  # ensemble). The default model: Aurora with the IMERG-calibrated precipitation head, downscaled
  # with the UNet. The labels below are fallbacks; each model's entry in `models` sets its own.
  source_id: aurora_imerg_unet
  model_label: Aurora-IMERG · UNet
  source_label: Aurora (IMERG head) · UNet downscaled
  wet_day_threshold_mm: 1.0
  dry_spell_min_days: 5
  wet_spell_min_days: 3
  # Onset: at least 20 mm within 3 days, with no dry spell longer than 10 days in the 30 days from then.
  onset_threshold_mm: 20.0
  onset_window_days: 3
  onset_guard_days: 30
  onset_guard_max_dry_days: 10
  # Extreme rain layer: chance of 24-hour rainfall at or above this.
  extreme_rain_mm: 50.0
  min_lead_days: 7
  expected_lead_days: 46
  retention_runs: 10
  stale_after_days: 3
  # Upstream's live layout (Azure account italynorthdata, container data), read with the container
  # SAS URL in the ITALYNORTH_SAS_URL secret:
  #   <live_root><src>/<live_region>/YYYY-MM-DD/<model_dir>/[<ckpt_prefix>*/]<variable>/precip_24h/data/
  # `src` is ifs or aurora; Aurora's two precipitation heads are separate variable folders. The
  # top-level aurora-imerg/ folder is an older copy (stopped 2026-11-12) and is not read.
  live_root: live_forecasts/downscaled_models/
  live_region: east_africa-ghana-kenya-senegal-west_africa
  # The model picker: each S2S source (family) x downscaler. Runs of each model are kept apart
  # under data/artifacts/subseasonal/<id>/. Each run's manifest records the checkpoint and sampler
  # settings parsed from the folder it was read from; `provenance` below only fills gaps.
  # Ensembles (10 members, ~4.5 MB a run) keep fewer runs so the API bundle stays small.
  models:
    aurora_imerg_unet:
      model_label: Aurora-IMERG · UNet
      source_label: Aurora (IMERG head) · UNet downscaled
      family: aurora_imerg
      family_label: Aurora · IMERG head
      downscaling: unet
      downscaling_label: UNet
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: aurora, model_dir: model_unet_precip_output_residual_fs128, ckpt_prefix: ckpt-unet-722-, variable: total_precipitation_24h_acc_imerg}
      description: Microsoft Aurora with the precipitation head calibrated to IMERG, downscaled to 0.1° with a deterministic UNet.
      provenance: &unet_provenance {model_type: unet}
    aurora_imerg_diffusion:
      model_label: Aurora-IMERG · Diffusion
      source_label: Aurora (IMERG head) · diffusion UNet downscaled (ensemble)
      family: aurora_imerg
      family_label: Aurora · IMERG head
      downscaling: diffusion
      downscaling_label: Diffusion
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: aurora, model_dir: model_diffusion_unet_precip_output_residual_shiftedlog_calibrated_silu_selfcond_precip24h_only, ckpt_prefix: ckpt-diffusion-717-, variable: total_precipitation_24h_acc_imerg}
      retention_runs: 4
      description: Aurora (IMERG head) downscaled with a diffusion UNet; each member is an independent sample.
      provenance: &diffusion_provenance {model_type: diffusion_unet}
    aurora_imerg_flow:
      model_label: Aurora-IMERG · Flow matching
      source_label: Aurora (IMERG head) · flow-matching UNet downscaled (ensemble)
      family: aurora_imerg
      family_label: Aurora · IMERG head
      downscaling: flow_matching
      downscaling_label: Flow matching
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: aurora, model_dir: model_flow_matching_unet_multivar_residual_shifted_log_precip24h_only, ckpt_prefix: ckpt-fm-716-, variable: total_precipitation_24h_acc_imerg}
      retention_runs: 4
      description: Aurora (IMERG head) downscaled with a flow-matching UNet that also reads wind, temperature, pressure and moisture; each member is an independent sample.
      provenance: &flow_provenance {model_type: flow_matching_unet}
    aurora_imerg_bilinear:
      model_label: Aurora-IMERG · Bilinear
      source_label: Aurora (IMERG head) · bilinear interpolation
      family: aurora_imerg
      family_label: Aurora · IMERG head
      downscaling: bilinear
      downscaling_label: Bilinear
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: aurora, model_dir: bilinear_global_precip, variable: total_precipitation_24h_acc_imerg}
      description: Aurora (IMERG head) interpolated bilinearly to 0.1°, with no machine learning; the baseline the downscalers improve on.
      provenance: &bilinear_provenance {model_type: bilinear interpolation}
    aurora_era5_unet:
      model_label: Aurora-ERA5 · UNet
      source_label: Aurora (ERA5 head) · UNet downscaled
      family: aurora_era5
      family_label: Aurora · ERA5 head
      downscaling: unet
      downscaling_label: UNet
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: aurora, model_dir: model_unet_precip_output_residual_fs128, ckpt_prefix: ckpt-unet-722-, variable: total_precipitation_24h_acc_era5}
      description: Microsoft Aurora with the precipitation head calibrated to ERA5, downscaled to 0.1° with a deterministic UNet.
      provenance: *unet_provenance
    aurora_era5_diffusion:
      model_label: Aurora-ERA5 · Diffusion
      source_label: Aurora (ERA5 head) · diffusion UNet downscaled (ensemble)
      family: aurora_era5
      family_label: Aurora · ERA5 head
      downscaling: diffusion
      downscaling_label: Diffusion
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: aurora, model_dir: model_diffusion_unet_precip_output_residual_shiftedlog_calibrated_silu_selfcond_precip24h_only, ckpt_prefix: ckpt-diffusion-717-, variable: total_precipitation_24h_acc_era5}
      retention_runs: 4
      description: Aurora (ERA5 head) downscaled with a diffusion UNet; each member is an independent sample.
      provenance: *diffusion_provenance
    aurora_era5_flow:
      model_label: Aurora-ERA5 · Flow matching
      source_label: Aurora (ERA5 head) · flow-matching UNet downscaled (ensemble)
      family: aurora_era5
      family_label: Aurora · ERA5 head
      downscaling: flow_matching
      downscaling_label: Flow matching
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: aurora, model_dir: model_flow_matching_unet_multivar_residual_shifted_log_precip24h_only, ckpt_prefix: ckpt-fm-716-, variable: total_precipitation_24h_acc_era5}
      retention_runs: 4
      description: Aurora (ERA5 head) downscaled with a flow-matching UNet that also reads wind, temperature, pressure and moisture; each member is an independent sample.
      provenance: *flow_provenance
    aurora_era5_bilinear:
      model_label: Aurora-ERA5 · Bilinear
      source_label: Aurora (ERA5 head) · bilinear interpolation
      family: aurora_era5
      family_label: Aurora · ERA5 head
      downscaling: bilinear
      downscaling_label: Bilinear
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: aurora, model_dir: bilinear_global_precip, variable: total_precipitation_24h_acc_era5}
      description: Aurora (ERA5 head) interpolated bilinearly to 0.1°, with no machine learning.
      provenance: *bilinear_provenance
    ifs_unet:
      model_label: IFS-UNet
      source_label: ECMWF IFS · UNet downscaled
      family: ifs
      family_label: ECMWF IFS
      downscaling: unet
      downscaling_label: UNet
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: ifs, model_dir: model_unet_precip_output_residual_fs128, ckpt_prefix: ckpt-unet-722-, variable: total_precipitation_24h_acc}
      description: ECMWF IFS extended range, downscaled to 0.1° with a deterministic UNet.
      provenance: *unet_provenance
    ifs_diffusion:
      model_label: IFS-Diffusion
      source_label: ECMWF IFS · diffusion UNet downscaled (ensemble)
      family: ifs
      family_label: ECMWF IFS
      downscaling: diffusion
      downscaling_label: Diffusion
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: ifs, model_dir: model_diffusion_unet_precip_output_residual_shiftedlog_calibrated_silu_selfcond_precip24h_only, ckpt_prefix: ckpt-diffusion-717-, variable: total_precipitation_24h_acc}
      retention_runs: 4
      description: ECMWF IFS extended range, downscaled with a diffusion UNet; each member is an independent sample.
      provenance: *diffusion_provenance
    ifs_flow:
      model_label: IFS · Flow matching
      source_label: ECMWF IFS · flow-matching UNet downscaled (ensemble)
      family: ifs
      family_label: ECMWF IFS
      downscaling: flow_matching
      downscaling_label: Flow matching
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: ifs, model_dir: model_flow_matching_unet_multivar_residual_shifted_log_precip24h_only, ckpt_prefix: ckpt-fm-716-, variable: total_precipitation_24h_acc}
      retention_runs: 4
      description: ECMWF IFS extended range, downscaled with a flow-matching UNet that also reads wind, temperature, pressure and moisture; each member is an independent sample.
      provenance: *flow_provenance
    ifs_bilinear:
      model_label: IFS · Bilinear
      source_label: ECMWF IFS · bilinear interpolation
      family: ifs
      family_label: ECMWF IFS
      downscaling: bilinear
      downscaling_label: Bilinear
      sas_secret: ITALYNORTH_SAS_URL
      live: {src: ifs, model_dir: bilinear_global_precip, variable: total_precipitation_24h_acc}
      description: ECMWF IFS extended range interpolated bilinearly to 0.1°, with no machine learning.
