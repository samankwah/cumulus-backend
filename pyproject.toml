[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cumulus"
version = "0.1.0"
description = "Baseline weather downscaling and agro-advisory backend for Ghana."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "joblib>=1.4.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.11.0",
  "uvicorn>=0.30.0",
  "xarray>=2024.6.0",
]

[project.optional-dependencies]
grib = ["cfgrib>=0.9.12.0"]
download = ["cdsapi>=0.7.5"]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
